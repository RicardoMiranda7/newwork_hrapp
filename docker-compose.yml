version: '3.8'

services:
  db:
    image: postgres:17
    volumes:
      - postgres_data:/var/lib/postgresql/data/
    environment:
      - POSTGRES_DB=newwork_db
      - POSTGRES_USER=user
      - POSTGRES_PASSWORD=password
    ports:
      - "5432:5432"

  backend:
    build: ./backend
    command: >
      sh -c "python manage.py migrate &&
             python manage.py createsuperuser --noinput --username=my_user --email=my_user@domain.com &&
             python manage.py generate_demo &&
             python manage.py runserver 0.0.0:8000"
    volumes:
      - ./backend:/app
    ports:
      - "8000:8000"
    depends_on:
      - db
    environment:
      - DB_NAME=newwork_db
      - DB_USER=user
      - DB_PASSWORD=password
      - DB_HOST=db

volumes:
  postgres_data: